# dsh-free-search — free web search providers (no API key needed)
# Registers the free-search plugin into ctx.web + a settings bridge
# (/api/dsh-free-search-settings) that serves the "free-search" namespace.
# The engine (ddg / ddg-lite / bing) is chosen from the web Settings page:
#   DSH 0.1.6-alpha.2+: sidebar Plugins page -> Installed -> free-search -> row config
#   DSH 0.1.5 and earlier: Settings > Plugins > Configurable > Free Search
# or from settings.yaml:
#   free-search:
#     provider: bing
#     region: cn-zh        # DuckDuckGo region
#     bingMarket: zh-CN    # Bing market
# Failed/empty engines automatically fall back to the next free engine.
# web.searchProvider must point at this plugin's provider id (ddg).
- insert:
    - id: web-search-free
      name: dsh-free-search
      config:
        provider: bing
        bingMarket: zh-CN
# Automatically take over the default search: harness web_search then goes straight to this
# plugin's provider (which contains every engine internally).
# Note: patch semantics replace the whole config entry (DSH 0.1.2+), so fetchProvider must be
# kept; otherwise web-fetch-http gets re-registered by another layer, producing a duplicate
# loader entry next to the base bundle registration.
- id: web
  config:
    searchProvider: ddg
    fetchProvider: http
